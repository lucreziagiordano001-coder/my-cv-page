    <!-- CONTAINER DEL FORM -->
    <main class="container my-5 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="contact-card p-4 p-md-5">
                    <h1 class="section-title h2 mb-3">Mettiamoci in Contatto</h1>
                    <p class="text-muted mb-4">Compila il form sottostante. Riceverò il tuo messaggio in tempo reale!</p>
                    
                    <!-- FORM -->
                    <form id="contact-form">
                        <div class="mb-3">
                            <label for="user_name" class="form-label fw-semibold">Nome / Azienda</label>
                            <input type="text" class="form-control custom-input" id="user_name" name="user_name" required placeholder="Inserisci il tuo nome">
                        </div>
                        <div class="mb-3">
                            <label for="user_email" class="form-label fw-semibold">Indirizzo Email</label>
                            <input type="email" class="form-control custom-input" id="user_email" name="user_email" required placeholder="nome@azienda.com">
                        </div>
                        <div class="mb-4">
                            <label for="message" class="form-label fw-semibold">Messaggio</label>
                            <textarea class="form-control custom-input" id="message" name="message" rows="5" required placeholder="Parliamo del tuo prossimo progetto software o linguistico..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-gradient w-100 py-3">Invia Messaggio</button>
                    </form>
                    
                    <div id="form-status" class="mt-3 text-center fw-semibold" role="status" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer text-center mt-5">
        <div class="container">
            <p class="copy mb-0">&copy; 2026 Lucrezia Giordano. Proiettata verso il futuro.</p>
        </div>
    </footer>

    <!-- LOGICA DI INVIO MESSAGGIO -->
    <script>
        // ====== CONFIGURAZIONE EMAILJS (da compilare dopo la registrazione su emailjs.com) ======
        const EMAILJS_PUBLIC_KEY  = "LA_TUA_PUBLIC_KEY_DI_EMAILJS";
        const EMAILJS_SERVICE_ID  = "YOUR_SERVICE_ID";
        const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";
        const CONTACT_EMAIL       = "lucreziagiordano001@gmail.com";
        // ========================================================================================

        const configured = ![EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID]
            .some(v => v.startsWith("LA_TUA_") || v.startsWith("YOUR_"));

        if (configured) {
            emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
        }

        const form = document.getElementById('contact-form');
        const statusDiv = document.getElementById('form-status');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            if (!configured) {
                statusDiv.textContent = "Il modulo non è ancora attivo. Scrivimi direttamente a " + CONTACT_EMAIL;
                statusDiv.style.color = "red";
                return;
            }

            statusDiv.textContent = "Invio in corso... ⏳";
            statusDiv.style.color = "#7928ca";

            emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, form)
                .then(() => {
                    statusDiv.textContent = "Messaggio inviato con successo! 🚀 Ti risponderò prestissimo.";
                    statusDiv.style.color = "green";
                    form.reset();
                }, (error) => {
                    statusDiv.textContent = "Errore durante l'invio. ❌ Riprova o scrivimi a " + CONTACT_EMAIL;
                    statusDiv.style.color = "red";
                    console.error('EmailJS Error:', error);
                });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
